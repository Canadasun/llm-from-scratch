name: CI

# Always-on gate: runs on every push and PR. It exercises the whole test suite,
# which includes the evaluation harness (task-file validation, likelihood/scoring
# maths, the sandboxed code runner), the serving layer, and the eval regression
# logic. No GPU, no network, no checkpoint required — so it is fast and reliable.
#
# The *model-level* regression gate (does a trained checkpoint regress vs the
# recorded baseline?) needs a checkpoint and lives in eval-regression.yml.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  owner-ingress:
    if: ${{ vars.LLM_OWNER_INGRESS_PROBE != '' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Verify a non-owner cannot reach the app
        env:
          PROBE_URL: ${{ vars.LLM_OWNER_INGRESS_PROBE }}
        run: |
          case "$PROBE_URL" in
            https://*.canadacentral.azurecontainerapps.io/healthz) ;;
            *) echo "Unexpected ingress probe target"; exit 1 ;;
          esac
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 45 "$PROBE_URL")
          echo "Non-owner HTTP status: $status"
          test "$status" = 403
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 45 -H 'X-Forwarded-For: 127.0.0.1' "$PROBE_URL")
          echo "Spoofed-forwarded-header HTTP status: $status"
          test "$status" = 403
  test:
    # Pin the sandbox host rather than inheriting namespace-policy changes from latest.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install code-evaluation isolation dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libseccomp2

      - name: Verify host namespace support
        run: bwrap --unshare-all --ro-bind / / -- /usr/bin/true

      - name: Run test suite (unit + eval harness + serving + regression logic)
        env:
          LLM_REQUIRE_SANDBOX_TESTS: "1"
        run: python -m pytest -q

      - name: Audit Python dependencies for known vulnerabilities
        run: |
          pip install "pip-audit==2.10.1"
          pip-audit -r requirements.txt -r requirements-identity.txt --progress-spinner off

      - name: Secure code review of first-party packages (fail on high+)
        run: |
          # The platform reviews its own real code. codereview/testdata/ holds
          # intentionally vulnerable fixtures, so it is deliberately excluded:
          # we scan the package dirs that have no testdata, plus the top-level
          # source files, plus codereview's own modules (not its testdata/).
          for d in serve evals safety enterprise; do
            python -m codereview "$d" --fail-on high
          done
          for f in *.py codereview/*.py; do
            python -m codereview "$f" --fail-on high
          done

  preview-baseline:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-data.txt "numpy>=2.0"

      - name: Install code-evaluation isolation dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libseccomp2

      - name: Build frozen benchmark suites from pinned sources
        run: |
          python -m evals.bench build --raw "$RUNNER_TEMP/bench-raw" --out "$RUNNER_TEMP/bench"
          python -m evals.bench verify --out "$RUNNER_TEMP/bench"

      - name: Rescore committed preview programs in the sandbox and compare with the baseline
        run: python -m evals.preview check --bench-dir "$RUNNER_TEMP/bench"

  image-scan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build serving image
        run: docker build -t llm-serve:ci .

      - name: Verify the image runs as a non-root user
        run: |
          user=$(docker run --rm --entrypoint id llm-serve:ci -u)
          echo "Container uid: $user"
          test "$user" != 0

      - name: Scan image for fixable critical vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: llm-serve:ci
          fail-build: true
          severity-cutoff: critical
          only-fixed: true
          output-format: table

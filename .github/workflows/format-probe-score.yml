name: Score accepted format probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  score:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install isolation dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libseccomp2
      - name: Score recorded responses only inside the sandbox
        run: >-
          python -m evals.format_probe_run score
          --responses evals/results/format_probe/responses-base.json
          --out "$RUNNER_TEMP/format-probe-scores.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: format-probe-scores
          path: ${{ runner.temp }}/format-probe-scores.json
          if-no-files-found: error

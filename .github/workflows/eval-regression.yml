name: Eval regression gate

# Candidate checkpoint evaluation fails closed for release tags and manual runs
# when the artifact is unavailable. Scheduled and PR runs are skipped with a
# notice until MODEL_CHECKPOINT_URL and MODEL_CHECKPOINT_SHA256 are configured.

on:
  workflow_dispatch:
    inputs:
      checkpoint_url:
        description: "HTTPS URL of the candidate checkpoint"
        required: true
      checkpoint_sha256:
        description: "Expected SHA-256 digest of the candidate checkpoint"
        required: true
  pull_request:
    branches: [master]
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 6 * * *"   # nightly 06:17 UTC

jobs:
  checkpoint-not-configured:
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') && vars.MODEL_CHECKPOINT_URL == ''
    runs-on: ubuntu-22.04
    permissions: {}
    steps:
      - run: echo "::notice::Eval regression gate skipped - set the MODEL_CHECKPOINT_URL and MODEL_CHECKPOINT_SHA256 repository variables to evaluate a candidate checkpoint."

  regression:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || vars.MODEL_CHECKPOINT_URL != ''
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CHECKPOINT_URL: ${{ inputs.checkpoint_url || vars.MODEL_CHECKPOINT_URL }}
      CHECKPOINT_SHA256: ${{ inputs.checkpoint_sha256 || vars.MODEL_CHECKPOINT_SHA256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install code-evaluation isolation dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libseccomp2

      - name: Verify host namespace support
        run: bwrap --unshare-all --ro-bind / / -- /usr/bin/true

      - name: Fetch and verify candidate checkpoint
        run: |
          test -n "$CHECKPOINT_URL" || { echo "::error::Candidate checkpoint URL is required"; exit 1; }
          [[ "$CHECKPOINT_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::Valid checkpoint SHA-256 is required"; exit 1; }
          mkdir -p checkpoints
          curl --proto '=https' --proto-redir '=https' --max-time 300 -fSL -- "$CHECKPOINT_URL" -o checkpoints/ckpt.pt
          printf '%s  checkpoints/ckpt.pt\n' "$CHECKPOINT_SHA256" | sha256sum --check --status

      - name: Measure candidate checkpoint
        run: |
          python -m evals.run \
            --ckpt checkpoints/ckpt.pt \
            --device cpu --threads 2 --task-timeout 120 \
            --json evals/results-candidate.json

      - name: Review candidate and enforce regression floor
        run: |
          python -m evals.review --results evals/results-candidate.json \
            --baseline evals/baselines/m3.json --markdown evals/review-candidate.md

      - name: Preserve evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-evaluation
          path: |
            evals/results-candidate.json
            evals/review-candidate.md
          if-no-files-found: warn
          retention-days: 14

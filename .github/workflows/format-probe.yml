name: Verify original format probe

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - data/format_probe_tasks.py
      - evals/format_probe.py
      - evals/code_executor.py
      - evals/code_worker.py
      - .github/workflows/format-probe.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install isolation dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap libseccomp2
      - name: Verify references and negative controls in the sandbox
        run: python -m evals.format_probe --verify --out "$RUNNER_TEMP/format-probe-verification.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: format-probe-verification
          path: ${{ runner.temp }}/format-probe-verification.json
          if-no-files-found: error

name: Qualify release image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release holding the checkpoint"
        required: true
        default: "phase4-base-2026-11-10"
      asset:
        description: "Checkpoint asset name"
        required: true
        default: "phase4-base-step8000.pt"
      checkpoint_sha256:
        description: "Expected checkpoint sha256"
        required: true
        default: "1164213e635d376946ec331d5ff238cf89f492788554a953010f59bd5f57a593"
      image_tag:
        description: "Tag for the pushed image (the digest is what gets qualified)"
        required: true
        default: "phase4-base-step8000"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.push.outputs.image }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      ASSET: ${{ inputs.asset }}
      CKPT_SHA256: ${{ inputs.checkpoint_sha256 }}
      IMAGE_TAG: ${{ inputs.image_tag }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "invalid release tag"; exit 1; }
          [[ "$ASSET" =~ ^[A-Za-z0-9._-]+\.pt$ ]] || { echo "invalid asset"; exit 1; }
          [[ "$CKPT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "invalid sha256"; exit 1; }
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "invalid image tag"; exit 1; }

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Fetch and verify checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p checkpoints "$RUNNER_TEMP/ckpt"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP/ckpt"
          printf '%s  %s\n' "$CKPT_SHA256" "$RUNNER_TEMP/ckpt/$ASSET" | sha256sum --check
          mv "$RUNNER_TEMP/ckpt/$ASSET" checkpoints/ckpt.pt

      - name: Build and push
        id: push
        env:
          TOKEN: ${{ github.token }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "llmfs.checkpoint.sha256=$CKPT_SHA256" --label "llmfs.git.commit=$GITHUB_SHA" \
            -t "$repo:$IMAGE_TAG" .
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$repo:$IMAGE_TAG"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$repo:$IMAGE_TAG")
          docker logout ghcr.io
          [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "no digest"; exit 1; }
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $digest" >> "$GITHUB_STEP_SUMMARY"

  qualify:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      CKPT_SHA256: ${{ inputs.checkpoint_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.15.0" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Pull image by digest
        id: pull
        env:
          TOKEN: ${{ github.token }}
        run: |
          [[ "$IMAGE" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]] || { echo "invalid image"; exit 1; }
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          start=$(date +%s.%N)
          docker pull "$IMAGE"
          end=$(date +%s.%N)
          docker logout ghcr.io
          python -c "print(round($end - $start, 1))" > "$RUNNER_TEMP/pull_seconds"
          docker image inspect "$IMAGE" --format '{{.Size}}' > "$RUNNER_TEMP/image_bytes"

      - name: Measure serving on 1 vCPU and 2 GiB
        run: |
          python -m deploy.measure --image "$IMAGE" --expect-checkpoint "$CKPT_SHA256" \
            --pull-seconds "$(cat "$RUNNER_TEMP/pull_seconds")" --image-bytes "$(cat "$RUNNER_TEMP/image_bytes")" \
            --json "$RUNNER_TEMP/serving.json"

      - name: Production gate (deploy.release qualify)
        if: always() && steps.pull.outcome == 'success'
        run: |
          set +e
          python -m deploy.release qualify --image "$IMAGE" --record "$RUNNER_TEMP/release-record.json" \
            2>&1 | tee "$RUNNER_TEMP/production-gate.txt"
          echo "exit=${PIPESTATUS[0]}" >> "$RUNNER_TEMP/production-gate.txt"
          exit 0

      - name: Summary
        if: always()
        run: |
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "### Serving" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/serving.json" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "### Production gate" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -5 "$RUNNER_TEMP/production-gate.txt" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification
          path: |
            ${{ runner.temp }}/serving.json
            ${{ runner.temp }}/release-record.json
            ${{ runner.temp }}/production-gate.txt
          if-no-files-found: warn
